<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bán Hàng & Sơ Đồ Bàn (POS) - Cafe Task Manager</title>
  <meta name="description" content="Giao diện bán hàng POS, quản lý sơ đồ bàn và gọi món thời gian thực của quán cafe.">

  <!-- CSS dùng chung của hệ thống -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Inline style mở rộng riêng cho màn hình POS -->
  <style>
    .pos-container {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: var(--space-md);
      height: calc(100vh - 120px);
      min-height: 600px;
    }

    @media (max-width: 1024px) {
      .pos-container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    /* Cột 1: Sơ đồ bàn */
    .table-panel {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .table-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: var(--space-sm);
    }

    .table-item {
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      background: var(--bg-surface-secondary);
      user-select: none;
    }

    .table-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .table-item.active {
      border-color: var(--primary);
    }

    .table-status-available { border-left: 4px solid var(--success); }
    .table-status-occupied { border-left: 4px solid var(--warning); }
    .table-status-kitchen { border-left: 4px solid var(--accent); }

    /* Cột 2: Thực đơn gọi món */
    .menu-panel {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .category-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: var(--space-md);
    }

    .category-btn {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-secondary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: var(--text-xs);
      font-weight: 500;
      white-space: nowrap;
    }

    .category-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .menu-item-card {
      background: var(--bg-surface-secondary);
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
    }

    .menu-item-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .item-icon {
      font-size: 28px;
      text-align: center;
      margin-bottom: 6px;
    }

    .item-name {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .item-price {
      font-size: var(--text-xs);
      color: var(--accent);
      font-weight: 700;
    }

    /* Cột 3: Hóa đơn & Giỏ hàng */
    .cart-panel {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin: var(--space-sm) 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: var(--bg-surface-secondary);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
    }

    .cart-summary {
      border-top: 1px dashed var(--border-color);
      padding-top: var(--space-sm);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: var(--text-sm);
    }

    .total-amount {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--primary);
    }
  </style>

  <!-- Chống FOUC Dark Mode -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme') || localStorage.getItem('CAFE_THEME');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark-theme', 'dark-mode');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <!-- Navbar chung -->
  <header class="site-navbar" id="site-navbar">
    <div class="container navbar-container">
      <a href="index.html" class="navbar-brand" aria-label="Về trang chủ Cafe Task Manager">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Cafe Task Manager</span>
          <span class="brand-badge">Bán Hàng POS</span>
        </div>
      </a>

      <nav class="navbar-nav" id="navbar-nav" aria-label="Điều hướng chính">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Trang chủ</a></li>
          <li><a href="pos.html" class="nav-link active" aria-current="page">Bán hàng (POS)</a></li>
          <li><a href="tasks.html" class="nav-link">Quản lý công việc</a></li>
          <li><a href="statistics.html" class="nav-link">Báo cáo &amp; Thống kê</a></li>
          <li><a href="pages/page-3.html" class="nav-link">Phân công ca trực</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Chuyển đổi giao diện Sáng/Tối">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Màn hình chính POS -->
  <main class="main-content" style="padding-top: var(--space-md); padding-bottom: var(--space-md);">
    <div class="container" style="max-width: 1400px;">
      <div class="pos-container">
        
        <!-- Cột 1: Sơ đồ bàn -->
        <div class="table-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h2 style="font-size: var(--text-base); font-weight: 700; margin: 0;">Sơ Đồ Bàn</h2>
            <span style="font-size: var(--text-xs); color: var(--text-muted);" id="current-table-label">Chưa chọn</span>
          </div>

          <div style="display: flex; gap: 8px; font-size: 11px; margin-bottom: 8px; color: var(--text-muted);">
            <span>🟢 Trống</span>
            <span>🟡 Có khách</span>
            <span>🟠 Chờ làm</span>
          </div>

          <div class="table-grid" id="tables-container">
            <!-- Render danh sách bàn -->
          </div>
        </div>

        <!-- Cột 2: Danh mục & Menu món -->
        <div class="menu-panel">
          <div class="category-filter" id="category-filter">
            <button class="category-btn active" data-category="ALL">Tất cả</button>
            <button class="category-btn" data-category="Cà phê">Cà phê</button>
            <button class="category-btn" data-category="Trà & Macchiato">Trà & Trái cây</button>
            <button class="category-btn" data-category="Bánh ngọt">Bánh & Đồ ăn</button>
          </div>

          <div class="menu-grid" id="menu-container">
            <!-- Render danh sách món -->
          </div>
        </div>

        <!-- Cột 3: Hóa đơn & Thanh toán -->
        <div class="cart-panel">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
              <h2 style="font-size: var(--text-base); font-weight: 700; margin: 0;">Hóa Đơn</h2>
              <span class="badge badge-pending" id="cart-table-badge">Bàn: Chưa chọn</span>
            </div>

            <div class="cart-items" id="cart-items-container">
              <div style="text-align: center; color: var(--text-muted); font-size: var(--text-xs); margin-top: 40px;">
                Chọn bàn và bấm món để tạo hóa đơn
              </div>
            </div>
          </div>

          <div class="cart-summary">
            <div class="summary-row">
              <span style="color: var(--text-muted);">Tạm tính:</span>
              <span id="subtotal-amount" style="font-weight: 600;">0 đ</span>
            </div>
            <div class="summary-row">
              <span style="font-weight: 700;">Tổng thanh toán:</span>
              <span class="total-amount" id="total-amount">0 đ</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
              <button type="button" class="btn btn-secondary" id="btn-send-kds" style="font-size: var(--text-xs); justify-content: center;">
                ☕ Chuyển Barista Làm Món
              </button>
              <button type="button" class="btn btn-primary" id="btn-checkout" style="font-size: var(--text-xs); justify-content: center;">
                💳 Thanh Toán (VietQR / Tiền mặt)
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>

  <!-- Script xử lý Logic POS -->
  <script>
    (function () {
      // Dữ liệu mẫu 8 bàn phù hợp quán cafe
      const TABLES = [
        { id: 'T01', name: 'Bàn T01', status: 'available' },
        { id: 'T02', name: 'Bàn T02', status: 'occupied' },
        { id: 'T03', name: 'Bàn T03', status: 'available' },
        { id: 'T04', name: 'Bàn T04', status: 'kitchen' },
        { id: 'T05', name: 'Bàn T05', status: 'available' },
        { id: 'T06', name: 'Bàn T06', status: 'available' },
        { id: 'O01', name: 'Bàn O01 (Ngoài trời)', status: 'available' },
        { id: 'O02', name: 'Bàn O02 (Ngoài trời)', status: 'available' }
      ];

      // Danh mục món phù hợp DATABASE_DESIGN.md
      const MENU_ITEMS = [
        { id: 'CF01', name: 'Cà phê Đen Đá', price: 25000, category: 'Cà phê', icon: '☕' },
        { id: 'CF02', name: 'Cà phê Sữa Đá', price: 29000, category: 'Cà phê', icon: '🥛' },
        { id: 'CF03', name: 'Bạc Xỉu Sài Gòn', price: 32000, category: 'Cà phê', icon: '🧋' },
        { id: 'CF04', name: 'Espresso Nóng', price: 35000, category: 'Cà phê', icon: '☕' },
        { id: 'TR01', name: 'Trà Đào Cam Sả', price: 39000, category: 'Trà & Macchiato', icon: '🍑' },
        { id: 'TR02', name: 'Trà Vải Hoa Hồng', price: 39000, category: 'Trà & Macchiato', icon: '🌹' },
        { id: 'TR03', name: 'Trà Ô Long Macchiato', price: 42000, category: 'Trà & Macchiato', icon: '🍵' },
        { id: 'BK01', name: 'Bánh Croissant Bơ', price: 28000, category: 'Bánh ngọt', icon: '🥐' },
        { id: 'BK02', name: 'Tiramisu Cà Phê', price: 45000, category: 'Bánh ngọt', icon: '🍰' }
      ];

      let selectedTable = 'T01';
      let ordersByTable = {
        'T02': [{ id: 'CF02', name: 'Cà phê Sữa Đá', price: 29000, qty: 2 }]
      };

      function formatMoney(amount) {
        return new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
      }

      function renderTables() {
        const container = document.getElementById('tables-container');
        if (!container) return;

        container.innerHTML = TABLES.map(t => {
          const isSelected = t.id === selectedTable;
          const statusClass = 'table-status-' + t.status;
          return `
            <div class="table-item ${statusClass} ${isSelected ? 'active' : ''}" data-table-id="${t.id}">
              <div style="font-weight: 700; font-size: var(--text-xs);">${t.name}</div>
              <div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">
                ${t.status === 'available' ? 'Trống' : (t.status === 'occupied' ? 'Có khách' : 'Chờ làm')}
              </div>
            </div>
          `;
        }).join('');

        // Bắt sự kiện chọn bàn
        container.querySelectorAll('.table-item').forEach(el => {
          el.onclick = function() {
            selectedTable = this.getAttribute('data-table-id');
            renderTables();
            renderCart();
          };
        });

        const currentLabel = document.getElementById('current-table-label');
        if (currentLabel) currentLabel.textContent = 'Đang chọn: ' + selectedTable;

        const cartBadge = document.getElementById('cart-table-badge');
        if (cartBadge) cartBadge.textContent = 'Bàn: ' + selectedTable;
      }

      function renderMenu(categoryFilter = 'ALL') {
        const container = document.getElementById('menu-container');
        if (!container) return;

        const filtered = categoryFilter === 'ALL' 
          ? MENU_ITEMS 
          : MENU_ITEMS.filter(m => m.category === categoryFilter);

        container.innerHTML = filtered.map(item => `
          <div class="menu-item-card" data-item-id="${item.id}">
            <div class="item-icon">${item.icon}</div>
            <div class="item-name">${item.name}</div>
            <div class="item-price">${formatMoney(item.price)}</div>
          </div>
        `).join('');

        container.querySelectorAll('.menu-item-card').forEach(el => {
          el.onclick = function() {
            const itemId = this.getAttribute('data-item-id');
            addItemToCurrentTable(itemId);
          };
        });
      }

      function addItemToCurrentTable(itemId) {
        if (!selectedTable) return;
        if (!ordersByTable[selectedTable]) {
          ordersByTable[selectedTable] = [];
        }

        const product = MENU_ITEMS.find(m => m.id === itemId);
        if (!product) return;

        const existing = ordersByTable[selectedTable].find(i => i.id === itemId);
        if (existing) {
          existing.qty += 1;
        } else {
          ordersByTable[selectedTable].push({ ...product, qty: 1 });
        }

        // Cập nhật trạng thái bàn thành occupied nếu đang available
        const currentTableObj = TABLES.find(t => t.id === selectedTable);
        if (currentTableObj && currentTableObj.status === 'available') {
          currentTableObj.status = 'occupied';
          renderTables();
        }

        renderCart();
      }

      function renderCart() {
        const container = document.getElementById('cart-items-container');
        const subtotalEl = document.getElementById('subtotal-amount');
        const totalEl = document.getElementById('total-amount');
        if (!container) return;

        const items = ordersByTable[selectedTable] || [];

        if (items.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: var(--text-xs); margin-top: 40px;">Bàn này chưa gọi món nào.</div>';
          if (subtotalEl) subtotalEl.textContent = '0 đ';
          if (totalEl) totalEl.textContent = '0 đ';
          return;
        }

        let total = 0;
        container.innerHTML = items.map((item, index) => {
          const itemTotal = item.price * item.qty;
          total += itemTotal;
          return `
            <div class="cart-item">
              <div style="flex: 1;">
                <div style="font-weight: 600;">${item.name}</div>
                <div style="color: var(--text-muted); font-size: 11px;">${formatMoney(item.price)} x ${item.qty}</div>
              </div>
              <div style="font-weight: 700; color: var(--accent); margin-right: 8px;">
                ${formatMoney(itemTotal)}
              </div>
              <button type="button" class="btn-remove-item" data-index="${index}" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;">✕</button>
            </div>
          `;
        }).join('');

        if (subtotalEl) subtotalEl.textContent = formatMoney(total);
        if (totalEl) totalEl.textContent = formatMoney(total);

        container.querySelectorAll('.btn-remove-item').forEach(btn => {
          btn.onclick = function() {
            const idx = parseInt(this.getAttribute('data-index'), 10);
            ordersByTable[selectedTable].splice(idx, 1);
            if (ordersByTable[selectedTable].length === 0) {
              const currentTableObj = TABLES.find(t => t.id === selectedTable);
              if (currentTableObj) currentTableObj.status = 'available';
              renderTables();
            }
            renderCart();
          };
        });
      }

      // Xử lý gửi món sang Barista
      document.getElementById('btn-send-kds')?.addEventListener('click', function() {
        const items = ordersByTable[selectedTable] || [];
        if (items.length === 0) {
          alert('Bàn chưa có món để gửi Barista!');
          return;
        }
        const currentTableObj = TABLES.find(t => t.id === selectedTable);
        if (currentTableObj) {
          currentTableObj.status = 'kitchen';
          renderTables();
        }
        alert('Đã gửi thông báo đơn bàn ' + selectedTable + ' đến quầy pha chế!');
      });

      // Xử lý thanh toán
      document.getElementById('btn-checkout')?.addEventListener('click', function() {
        const items = ordersByTable[selectedTable] || [];
        if (items.length === 0) {
          alert('Bàn chưa có món để thanh toán!');
          return;
        }
        const total = items.reduce((sum, i) => sum + (i.price * i.qty), 0);
        if (confirm(`Xác nhận thanh toán cho ${selectedTable}?\nTổng số tiền: ${formatMoney(total)}`)) {
          ordersByTable[selectedTable] = [];
          const currentTableObj = TABLES.find(t => t.id === selectedTable);
          if (currentTableObj) {
            currentTableObj.status = 'available';
            renderTables();
          }
          renderCart();
          alert('Thanh toán thành công! Bàn ' + selectedTable + ' đã sẵn sàng đón khách mới.');
        }
      });

      // Lọc danh mục món
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.onclick = function() {
          document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          renderMenu(this.getAttribute('data-category'));
        };
      });

      // Khởi tạo giao diện
      renderTables();
      renderMenu();
      renderCart();
    })();
  </script>
</body>

</html>
