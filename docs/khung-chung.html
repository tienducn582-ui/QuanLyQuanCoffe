<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khung Trang Chuẩn - Cafe Task Manager</title>
  <meta name="description" content="Mẫu khung chung chuẩn HTML5, Bootstrap 5 và CSS cho toàn bộ các trang trong hệ thống.">

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN (tùy chọn) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Dùng Chung Tông Màu Nâu Cafe (khi copy vào các trang trong public/ thì dùng assets/css/style.css) -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Chống chớp sáng Dark/Light Mode (Tránh FOUC) -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme', 'dark-mode');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="bg-primary d-flex flex-column min-vh-100">

  <!-- THANH ĐIỀU HƯỚNG CHUNG: ui.js sẽ tự động render vào thẻ nav#navbar này -->
  <nav id="navbar"></nav>

  <!-- NỘI DUNG CHÍNH CỦA TỪNG TRANG -->
  <main class="container py-4 flex-grow-1">
    <!-- Tiêu đề trang & Thanh công cụ (Breadcrumb / Actions) -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-2">
      <div>
        <h2 class="fw-bold mb-1" style="color: var(--primary);">Tiêu Đề Trang</h2>
        <p class="text-secondary small mb-0">Mô tả ngắn gọn chức năng của trang này.</p>
      </div>
      <div>
        <!-- Nút hành động chính (nếu có) -->
        <button class="btn btn-primary btn-sm">
          + Thêm Mới
        </button>
      </div>
    </div>

    <!-- Khối thẻ nội dung (Card) -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <!-- Vùng dữ liệu / Bộ lọc / Bảng -->
        <p class="text-muted">Nội dung nghiệp vụ của từng trang đặt tại đây.</p>
      </div>
    </div>
  </main>

  <!-- FOOTER CHUNG -->
  <footer class="footer py-4 mt-auto border-top bg-surface">
    <div class="container text-center text-muted small">
      <p class="mb-1">© 2026 Cafe Task Manager - Môn Phát triển ứng dụng Web (PROG2008).</p>
      <p class="mb-0">Dự án nhóm 5 người · Thiết kế giao diện thân thiện, responsive đa màn hình.</p>
    </div>
  </footer>

  <!-- CÁC SCRIPT BẮT BUỘC NẠP THEO THỨ TỰ -->
  <!-- 1. Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 2. api.js: Cung cấp apiFetch, getUser, isAdmin, requireLogin, logout -->
  <script src="/assets/js/api.js"></script>
  <!-- 3. ui.js: Cung cấp showToast, renderNavbar, renderPagination, showEmpty, escapeHtml, showLoading, hideLoading, validateField -->
  <script src="/assets/js/ui.js"></script>
  <!-- 4. Script riêng của trang (auth.js, tasks.js, shifts.js hoặc statistics.js) -->
  <!-- <script src="assets/js/tên_file.js"></script> -->
</body>
</html>
