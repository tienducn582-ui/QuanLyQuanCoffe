<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phân Công Ca Làm Việc - Cafe Task Manager</title>
  <meta name="description" content="Quản lý ca làm việc và theo dõi công việc theo từng ca trực quán cafe.">

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS Dùng Chung -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <!-- Navbar chung được render tự động qua ui.js -->
  <nav id="navbar"></nav>

  <main class="container my-4">
    <!-- Tiêu đề trang & Nút hành động -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h1 class="h3 mb-1 text-primary fw-bold">Quản Lý Ca Làm Việc</h1>
        <p class="text-muted mb-0">Theo dõi ca trực và các công việc được phân bổ theo ca.</p>
      </div>
      <div>
        <!-- Nút Thêm ca (Chỉ hiển thị với Admin qua shifts.js) -->
        <button type="button" class="btn btn-primary d-none" id="btnAddShift" data-bs-toggle="modal" data-bs-target="#shiftModal">
          <i class="bi bi-plus-circle"></i> + Thêm ca làm việc
        </button>
      </div>
    </div>

    <!-- Spinner Loading -->
    <div id="shiftsLoading" class="text-center my-5 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Đang tải dữ liệu...</span>
      </div>
      <p class="text-muted mt-2">Đang tải danh sách ca làm việc...</p>
    </div>

    <!-- Vùng rỗng khi chưa có ca -->
    <div id="shiftsEmpty" class="d-none"></div>

    <!-- Danh sách Ca làm việc (Hiển thị dạng thẻ) -->
    <div id="shiftsList" class="row g-4"></div>
  </main>

  <!-- Modal Thêm/Sửa Ca Làm Việc (Chỉ Admin) -->
  <div class="modal fade" id="shiftModal" tabindex="-1" aria-labelledby="shiftModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="shiftForm">
          <div class="modal-header">
            <h5 class="modal-title" id="shiftModalTitle">Thêm ca làm việc mới</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
          </div>
          <div class="modal-body">
            <div id="shiftFormError" class="alert alert-danger d-none"></div>
            <input type="hidden" id="shiftId">

            <div class="mb-3">
              <label for="shiftName" class="form-label">Tên ca <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="shiftName" placeholder="Ví dụ: Ca Sáng, Ca Tối" required maxlength="50">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="shiftStartTime" class="form-label">Giờ bắt đầu <span class="text-danger">*</span></label>
                <input type="time" class="form-control" id="shiftStartTime" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="shiftEndTime" class="form-label">Giờ kết thúc <span class="text-danger">*</span></label>
                <input type="time" class="form-control" id="shiftEndTime" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="shiftNote" class="form-label">Ghi chú</label>
              <textarea class="form-control" id="shiftNote" rows="2" placeholder="Ghi chú trọng tâm ca làm việc..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" class="btn btn-primary" id="btnSaveShift">Lưu ca làm</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1080;"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/shifts.js"></script>
</body>
</html>
