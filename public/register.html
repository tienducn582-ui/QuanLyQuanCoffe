<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản | Cafe Task Manager</title>
  <meta name="description" content="Đăng ký tài khoản nhân viên mới cho hệ thống Cafe Task Manager.">

  <!-- CSS Dùng Chung -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Chống chớp sáng Dark/Light Mode -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme', 'dark-mode');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>

  <!-- Navbar dùng chung -->
  <nav id="navbar"></nav>

  <!-- Vùng nội dung căn giữa tuyệt đối, không cuộn dọc ở 1366px và 1920px -->
  <div class="auth-page-wrapper">
    <div></div> <!-- Giữ đối xứng trên -->

    <main class="auth-card">
      <div class="auth-card-header">
        <div class="auth-card-logo">
          <img src="assets/img/logo.svg" alt="Cafe Logo" width="48" height="48">
        </div>
        <h2>Tạo Tài Khoản</h2>
        <p>Đăng ký tài khoản nhân viên mới cho quán</p>
      </div>

      <!-- Vùng hiển thị lỗi đăng ký -->
      <div id="formError" class="invalid-feedback" style="display: none; margin-bottom: var(--space-16); text-align: center; font-weight: 600;"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName" class="form-label">Họ và tên</label>
          <input type="text" class="form-control" id="fullName" name="fullName" placeholder="ví dụ: Nguyễn Văn A" required autocomplete="name">
          <div class="invalid-feedback"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Địa chỉ Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="ví dụ: staff@cafe.com" required autocomplete="email">
          <div class="invalid-feedback"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Tối thiểu 8 ký tự, gồm cả chữ và số" required autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu ở trên" required autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>

        <div style="margin-top: var(--space-24);">
          <button type="submit" id="btnRegister" class="btn btn-primary" style="width: 100%;">
            Đăng Ký
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: var(--space-24); padding-top: var(--space-16); border-top: 1px solid var(--border-subtle); font-size: var(--text-sm);">
        <span style="color: var(--text-secondary);">Đã có tài khoản? </span>
        <a href="login.html" style="font-weight: 600;">Đăng nhập ngay</a>
      </div>
    </main>

    <!-- Footer một dòng sát đáy -->
    <footer class="site-footer">
      <span>© 2026 Cafe Task Manager · Bài tập lớn môn Phát triển ứng dụng Web (PROG2008)</span>
    </footer>
  </div>

  <!-- Scripts nạp theo thứ tự: api.js -> ui.js -> auth.js -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
