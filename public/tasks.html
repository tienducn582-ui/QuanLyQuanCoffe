<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Công Việc - Cafe Task Manager</title>
  <meta name="description" content="Quản lý công việc quán cafe: tìm kiếm, lọc, phân trang, thêm, sửa, xóa và đổi trạng thái qua API.">

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS Dùng Chung (TV5) -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* Chữ phụ dùng biến màu của style.css nên đọc rõ ở cả giao diện sáng và tối */
    .task-muted { color: var(--text-secondary) !important; }
    /* Độ rộng tối thiểu của cột trên màn hình vừa; bảng cuộn ngang trong khung nếu thiếu chỗ */
    #tasksTableWrap th.col-title { min-width: 13rem; }
    #tasksTableWrap th.col-meta { min-width: 6.5rem; }
  </style>

  <!-- Chống chớp sáng khi dùng giao diện tối -->
  <script>
    (function () {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-theme', 'dark-mode');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <!-- Navbar chung được ui.js render tự động -->
  <nav id="navbar"></nav>

  <main class="container my-4">
    <!-- Tiêu đề trang & nút Thêm công việc (Admin và Staff đều được tạo) -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h1 class="h3 mb-1 text-primary fw-bold">Quản Lý Công Việc</h1>
        <p class="task-muted mb-0">Tìm kiếm, lọc và cập nhật công việc của quán theo từng ca.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btnAddTask">+ Thêm công việc</button>
    </div>

    <!-- Thanh tìm kiếm và bộ lọc -->
    <section class="card p-3 mb-4" aria-label="Tìm kiếm và lọc công việc">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-4">
          <label for="searchInput" class="form-label">Tìm kiếm</label>
          <input type="search" id="searchInput" class="form-control" placeholder="Tìm theo tên hoặc mô tả..." maxlength="200">
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="filterStatus" class="form-label">Trạng thái</label>
          <select id="filterStatus" class="form-select">
            <option value="">Tất cả</option>
            <option value="Pending">Chờ làm</option>
            <option value="InProgress">Đang làm</option>
            <option value="Done">Hoàn thành</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="filterPriority" class="form-label">Ưu tiên</label>
          <select id="filterPriority" class="form-select">
            <option value="">Tất cả</option>
            <option value="High">Cao</option>
            <option value="Medium">Trung bình</option>
            <option value="Low">Thấp</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="filterCategory" class="form-label">Danh mục</label>
          <select id="filterCategory" class="form-select">
            <option value="">Tất cả</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="filterShift" class="form-label">Ca làm</label>
          <select id="filterShift" class="form-select">
            <option value="">Tất cả</option>
          </select>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <small class="task-muted" id="tasksSummary">Đang tải...</small>
        <button type="button" class="btn btn-outline btn-sm" id="btnResetFilters">Xóa bộ lọc</button>
      </div>
    </section>

    <!-- Danh sách công việc -->
    <section class="card p-3" aria-label="Danh sách công việc">
      <div id="tasksLoading" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Đang tải dữ liệu...</span>
        </div>
        <p class="task-muted mt-2 mb-0">Đang tải danh sách công việc...</p>
      </div>

      <div id="tasksEmpty" class="d-none"></div>

      <div class="table-responsive" id="tasksTableWrap">
        <table class="table-custom table-cards">
          <thead>
            <tr>
              <th>Mã</th>
              <th class="col-title">Công việc</th>
              <th class="col-meta">Danh mục / Ca</th>
              <th class="col-meta">Người thực hiện</th>
              <th>Ưu tiên</th>
              <th>Hạn chót</th>
              <th>Trạng thái</th>
              <th class="text-end">Thao tác</th>
            </tr>
          </thead>
          <tbody id="tasksTableBody"></tbody>
        </table>
      </div>

      <div id="tasksPagination"></div>
    </section>
  </main>

  <!-- Modal Thêm / Sửa công việc -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="taskForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="taskModalTitle">Thêm công việc mới</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
          </div>
          <div class="modal-body">
            <div id="taskFormError" class="alert alert-danger d-none" role="alert"></div>
            <input type="hidden" id="taskId">

            <div class="mb-3">
              <label for="taskTitle" class="form-label">Tên công việc <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="taskTitle" maxlength="200" placeholder="Ví dụ: Kiểm tra hạn sử dụng sữa tươi" required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label for="taskDescription" class="form-label">Mô tả</label>
              <textarea class="form-control" id="taskDescription" rows="3" maxlength="2000" placeholder="Các bước thực hiện, lưu ý..."></textarea>
              <div class="invalid-feedback"></div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="taskStatus" class="form-label">Trạng thái</label>
                <select class="form-select" id="taskStatus">
                  <option value="Pending">Chờ làm</option>
                  <option value="InProgress">Đang làm</option>
                  <option value="Done">Hoàn thành</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="taskPriority" class="form-label">Ưu tiên</label>
                <select class="form-select" id="taskPriority">
                  <option value="Low">Thấp</option>
                  <option value="Medium" selected>Trung bình</option>
                  <option value="High">Cao</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="taskDeadline" class="form-label">Hạn chót</label>
                <input type="date" class="form-control" id="taskDeadline">
                <div class="invalid-feedback"></div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="taskCategory" class="form-label">Danh mục</label>
                <select class="form-select" id="taskCategory">
                  <option value="">-- Chưa phân loại --</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="taskShift" class="form-label">Ca làm</label>
                <select class="form-select" id="taskShift">
                  <option value="">-- Không thuộc ca --</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="taskAssignee" class="form-label">Người thực hiện</label>
                <select class="form-select" id="taskAssignee">
                  <option value="">-- Chưa giao --</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" class="btn btn-primary" id="btnSaveTask">Lưu công việc</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts: bootstrap bundle, api.js, ui.js rồi tới script riêng của trang -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/tasks.js"></script>
</body>
</html>
